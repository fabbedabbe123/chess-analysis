name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # relative base so the site works under https://<user>.github.io/<repo>/
      # Cloud sync: the project URL and the *publishable* key are public by design (they end up in the site anyway; row level security protects the data). Never put the secret / service_role key here.
      - run: npx vite build --base ./
        env:
          VITE_SUPABASE_URL: https://gnyjzhbclnlqurrfrqbr.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_bGJ4qKATd-4m39ycHlh72w_DPHtCBNd
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
