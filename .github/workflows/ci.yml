name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node scripts/build-lessons.mjs && git diff --exit-code public/data/lessons.json

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Start the built site
        run: |
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
      - name: Start a second build with a (mock) Supabase project for the cloud-sync test
        run: |
          VITE_SUPABASE_URL=https://testproj.supabase.co VITE_SUPABASE_ANON_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa npx vite build --outDir "$RUNNER_TEMP/dist-sync" --emptyOutDir
          nohup npx vite preview --port 4174 --strictPort --outDir "$RUNNER_TEMP/dist-sync" > preview-sync.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4174/ > /dev/null && break; sleep 1; done
      # real Stockfish in a real browser; these scripts exit non-zero on failure
      - run: mkdir -p /tmp/claude-0
      - run: python3 e2e/lessons.py
      - run: python3 e2e/features.py
      - run: python3 e2e/backup.py
      - run: python3 e2e/move_verdict.py
      - run: python3 e2e/strength.py
      - run: python3 e2e/front_door.py
      - run: python3 e2e/path.py
      - run: python3 e2e/board_resize.py
      - run: python3 e2e/perf_game.py
      - run: python3 e2e/no_page_scroll.py
      - run: python3 e2e/lichess.py
      - run: python3 e2e/puzzles_srs.py
      - run: python3 e2e/play_position_clock.py
      - run: python3 e2e/play_analyse.py
      - run: python3 e2e/play_settings_after.py
      - run: python3 e2e/strength_reset.py
      - run: python3 e2e/ui_round4.py
      - run: python3 e2e/ui_round4b.py
      - run: python3 e2e/layout_round5.py
      - name: Run python3 e2e/sync_cloud.py
        run: |
          python3 e2e/sync_cloud.py 2>&1 | tee sync_cloud.log; code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then grep -E "FAIL|Error|error|Timeout" sync_cloud.log | head -8 | while read -r l; do echo "::error::${l:0:400}"; done; fi
          exit $code
      - run: python3 e2e/board_fx.py
      - run: python3 e2e/knight_arrows.py
      - run: python3 e2e/sound_mobile.py
      - run: python3 e2e/mate_markers.py
      - run: python3 e2e/my_puzzles.py
      - run: python3 e2e/home.py
